[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "query-engine-py"
version = "0.1.0"
description = "Python LangGraph query engine for Text-to-SQL"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "langgraph>=0.2.0",
  "fastembed>=0.3.6",
  "google-genai>=1.20.0",
  "huggingface-hub>=0.33.0",
  "qdrant-client>=1.10.0",
  "pyodbc>=5.1.0",
  "bcrypt>=4.2.0",
  "PyJWT>=2.9.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.1"
]

[project.scripts]
query-engine-py = "main:run"
query-engine-seed = "seed:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main", "seed"]

[tool.setuptools.packages.find]
where = ["src"]
